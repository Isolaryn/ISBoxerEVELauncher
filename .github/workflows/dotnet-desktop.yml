name: .NET Framework Desktop

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'fork-main'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Get commit info
      id: commit_info
      run: |
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT

    - name: Create build info file
      run: |
        @"
        Build Information
        =================
        Branch: ${{ github.event.inputs.branch }}
        Commit: ${{ steps.commit_info.outputs.sha }}
        Short Commit: ${{ steps.commit_info.outputs.short_sha }}
        Built: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
        Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        "@ | Out-File -FilePath build-info.txt -Encoding utf8

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ISBoxerEVELauncher.sln

    - name: Build solution
      run: msbuild ISBoxerEVELauncher.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Copy build info to output
      run: Copy-Item build-info.txt bin/Release/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ISBoxerEVELauncher-${{ steps.commit_info.outputs.short_sha }}
        path: bin/Release/
        if-no-files-found: error
